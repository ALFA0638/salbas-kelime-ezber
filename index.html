    body {

      color: #f8fafc;

      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      margin: 0; 
      padding: 15px; 
    }
    .card { 
      background: #1e293b; 
      padding: 25px; 
      border-radius: 16px; 
      width: 100%; 
      max-width: 500px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);

    h2 { 
      margin-top: 0; 
      text-align: center; 
      color: #38bdf8; 
    }

      font-size: 1.8rem; 
      font-weight: bold; 
      text-align: center; 
      margin: 20px 0 10px; 
      min-height: 40px; 
      color: #38bdf8; 
      letter-spacing: 0.5px;
    }
    .level-badge {
      display: block;
      text-align: center;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 15px;
    }

      width: 100%; 
      padding: 12px; 
      border-radius: 8px; 
      border: 1px solid #475569; 
      background: #0f172a; 
      color: #fff; 
      font-size: 1.1rem; 
      outline: none; 
    }
    input[type="text"]:focus { 
      border-color: #38bdf8; 
    }

      width: 100%; 
      padding: 12px; 
      margin-top: 10px; 
      border-radius: 8px; 
      border: none; 
      font-weight: bold; 
      font-size: 1rem; 
      cursor: pointer; 
      background: #38bdf8; 
      color: #0f172a; 
    }
    button:hover { 
      background: #0ea5e9; 
    }
    .btn-secondary {
      background: #334155;
      color: #fff;
    }
    .btn-secondary:hover {
      background: #475569;
    }

      color: #fecaca;
      font-size: 0.85rem;
      padding: 8px;
    }
    .btn-danger:hover {
      background: #b91c1c;
    }

      margin-top: 15px; 
      text-align: center; 
      font-weight: bold; 
      font-size: 1.05rem; 
      min-height: 28px; 
    }
    .correct { 
      color: #4ade80; 
    }
    .wrong { 
      color: #f87171; 
    }
    .stats { 
      font-size: 0.9rem; 
      color: #94a3b8; 
      text-align: center; 
      margin-top: 20px; 
      border-top: 1px solid #334155; 
      padding-top: 15px; 
    }
    textarea { 
      width: 100%; 
      height: 110px; 
      background: #0f172a; 
      border: 1px solid #475569; 
      border-radius: 8px; 
      color: #fff; 
      padding: 10px; 
      font-size: 0.9rem; 
      margin-top: 10px; 
    }
    details { 
      margin-top: 15px; 
      font-size: 0.9rem; 
      color: #94a3b8; 
    }
    summary { 
      cursor: pointer; 
      color: #38bdf8; 
      font-weight: 500; 
    }
    .info-text {
      margin: 6px 0; 
      font-size: 0.8rem;
      color: #cbd5e1; 
    }
    .word-list {
      max-height: 200px;
      overflow-y: auto;
      margin-top: 12px;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px;
    }
    .word-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #1e293b;
      font-size: 0.85rem;
      gap: 6px;
    }
    .word-actions {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }

      width: auto;
      padding: 3px 8px;
      margin: 0;
      font-size: 0.75rem;
      background: #0284c7;
      color: white;
      border-radius: 4px;

      width: auto;
      padding: 3px 8px;
      margin: 0;
      font-size: 0.75rem;
      background: #ef4444;
      color: white;
      border-radius: 4px;

<body>

<div class="card">
  <h2>YDS Kelime Pratiği</h2>
  
  <div class="word-box" id="promptWord">Havuzda kelime yok!</div>
  <span class="level-badge" id="levelBadge"></span>
  
  <form id="quizForm" onsubmit="event.preventDefault(); checkAnswer();">
    <input type="text" id="answerInput" placeholder="Türkçe karşılığını yaz..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button type="submit">Kontrol Et</button>
  </form>

  <div class="feedback" id="feedback"></div>
  <div class="stats" id="stats">Havuz: 0 kelime</div>

  <details>
    <summary>Kelime Ekle / Havuzu Yönet</summary>
    <p class="info-text">
      Kelimeleri daima <b>İngilizce = Türkçe</b> formatında alt alta yaz.<br>
      Ters duran kelime varsa listeden <b>⇄</b> butonuna basarak yerini değiştir.
    </p>
    <textarea id="bulkInput" placeholder="can = olabilmek / -ebilmek&#10;bridge = köprü&#10;occupy = işgal etmek, yer kaplamak"></textarea>
    <button type="button" class="btn-secondary" onclick="addBulkWords()">Havuza Ekle</button>
    
    <div class="word-list" id="wordListContainer"></div>

    <button type="button" class="btn-danger" onclick="clearAllWords()" style="margin-top: 15px;">Tüm Kelimeleri Sıfırla</button>
  </details>
</div>

  let words = JSON.parse(localStorage.getItem("vocab_words")) || [];

  // Geliştirilmiş otomatik onarım: Sağ tarafta saf İngilizce harfler varsa ve sol tarafta boşluk/Türkçe varsa yer değiştirir
  let repaired = false;
  words = words.map(w => {
    let enPart = w.en.toLowerCase().trim();
    let trPart = w.tr.toLowerCase().trim();
    const trCharRegex = /[çğışöüÇĞİŞÖÜ]/;

    // Eğer 'en' kısmında Türkçe karakter varsa veya 'tr' kısmı sözlükte varsa yer değiştir
    if (trCharRegex.test(enPart) || (commonDictionary.includes(trPart) && !commonDictionary.includes(enPart))) {
      repaired = true;
      return {
        en: trPart,
        tr: enPart,
        level: (w.level !== undefined) ? w.level : 0,
        lastSeen: (w.lastSeen !== undefined) ? w.lastSeen : -999,
        nextDue: (w.nextDue !== undefined) ? w.nextDue : 0
      };
    }

    return {
      en: enPart,
      tr: trPart,
      level: (w.level !== undefined) ? w.level : 0,
      lastSeen: (w.lastSeen !== undefined) ? w.lastSeen : -999,
      nextDue: (w.nextDue !== undefined) ? w.nextDue : 0
    };
  });

  if (repaired) {
    localStorage.setItem("vocab_words", JSON.stringify(words));
  }

  function getEditDistance(a, b) {
    if (a.length === 0) return b.length;
    if (b.length === 0) return a.length;
    const matrix = [];
    for (let i = 0; i <= b.length; i++) matrix[i] = [i];
    for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

    for (let i = 1; i <= b.length; i++) {
      for (let j = 1; j <= a.length; j++) {
        if (b.charAt(i - 1) === a.charAt(j - 1)) {
          matrix[i][j] = matrix[i - 1][j - 1];
        } else {
          matrix[i][j] = Math.min(
            matrix[i - 1][j - 1] + 1,
            matrix[i][j - 1] + 1,
            matrix[i - 1][j] + 1
          );
        }
      }
    }
    return matrix[b.length][a.length];
  }

  function findClosestEnglishWord(input) {
    input = input.toLowerCase().trim();
    if (input.includes(" ")) return null; // Çok kelimeli ifadelerde typo uyarısı verme
    if (commonDictionary.includes(input)) return null;

    let closest = null;
    let minDistance = 999;

    for (let dictWord of commonDictionary) {
      let dist = getEditDistance(input, dictWord);
      let allowedDist = input.length <= 3 ? 1 : 2;
      if (dist <= allowedDist && dist < minDistance) {
        minDistance = dist;
        closest = dictWord;
      }
    }
    return closest;
  }

  function saveToStorage() {
    localStorage.setItem("vocab_words", JSON.stringify(words));
    localStorage.setItem("vocab_steps", totalSteps.toString());
    updateStats();
    renderWordList();
  }

  function pickRandomWord() {
    if (!words || words.length === 0) {
      document.getElementById("promptWord").textContent = "Havuzda kelime yok!";
      document.getElementById("levelBadge").textContent = "";
      document.getElementById("feedback").textContent = "";
      return;
    }

    totalSteps++;

    let candidates = words.filter(w => w.nextDue <= totalSteps && (!currentWord || w.en !== currentWord.en));

    if (candidates.length === 0) {
      candidates = words.filter(w => !currentWord || w.en !== currentWord.en);
      if (candidates.length === 0) candidates = words;
    }

    candidates.sort((a, b) => {
      if (a.level !== b.level) return a.level - b.level;
      return a.lastSeen - b.lastSeen;
    });

    let poolSize = Math.min(3, candidates.length);
    let selected = candidates[Math.floor(Math.random() * poolSize)];

    currentWord = selected;
    document.getElementById("promptWord").textContent = currentWord.en;
    
    const levelTexts = ["Yeni / Yanlış Yapıldı (Seviye 0)", "Öğreniliyor (Seviye 1)", "Pekiştiriliyor (Seviye 2)", "Ezberlendi (Seviye 3)"];
    document.getElementById("levelBadge").textContent = levelTexts[Math.min(currentWord.level, 3)];
    
    document.getElementById("answerInput").value = "";
    document.getElementById("feedback").textContent = "";
    document.getElementById("answerInput").focus();
  }

  function cleanTrString(str) {
    return str
      .toLowerCase()
      .replace(/^[-–—\s]+|[-–—\s]+$/g, "")
      .trim();
  }

  function isTurkishAnswerCorrect(userInput, fullTargetTr) {
    let cleanUser = cleanTrString(userInput);
    if (!cleanUser) return false;

    let validMeanings = fullTargetTr
      .split(/[/,;]/)
      .map(m => cleanTrString(m))
      .filter(m => m.length > 0);

    if (validMeanings.includes(cleanUser)) return true;

    let altUser = cleanUser.startsWith("-") ? cleanUser.substring(1) : "-" + cleanUser;
    if (validMeanings.includes(cleanTrString(altUser))) return true;

    return false;
  }

  function checkAnswer() {
    if (!currentWord) return;
    const userInput = document.getElementById("answerInput").value.trim();
    const feedback = document.getElementById("feedback");

    currentWord.lastSeen = totalSteps;

    if (isTurkishAnswerCorrect(userInput, currentWord.tr)) {
      feedback.textContent = `Doğru! (${currentWord.tr})`;
      feedback.className = "feedback correct";

      currentWord.level = Math.min(3, currentWord.level + 1);

      let poolFactor = Math.max(2, Math.floor(words.length * 0.2));
      let gap = (currentWord.level === 1) ? poolFactor : (currentWord.level === 2 ? poolFactor * 2 : poolFactor * 4);
      
      currentWord.nextDue = totalSteps + gap;
      saveToStorage();
      setTimeout(pickRandomWord, 700);
    } else {
      feedback.textContent = "Yanlış! Doğrusu: " + currentWord.tr;
      feedback.className = "feedback wrong";

      currentWord.level = 0;
      currentWord.nextDue = totalSteps + 2;
      saveToStorage();
    }
  }

  // Kesin Kural: Sol taraf = İngilizce, Sağ taraf = Türkçe
  function addBulkWords() {
    const raw = document.getElementById("bulkInput").value.trim();
    if (!raw) return;

    const lines = raw.split("\n");
    let addedCount = 0;

    lines.forEach(line => {
      const parts = line.split("=");
      if (parts.length === 2) {
        let enPart = parts[0].trim().toLowerCase();
        let trPart = parts[1].trim().toLowerCase();

        if (enPart && trPart) {
          let suggestion = findClosestEnglishWord(enPart);
          if (suggestion) {
            let acceptCorrection = confirm(`'${enPart}' kelimesinde yazım hatası olabilir.\nBunu '${suggestion}' olarak düzeltelim mi?`);
            if (acceptCorrection) {
              enPart = suggestion;
            }
          }

          let exists = words.find(w => w.en === enPart);
          if (exists) {
            exists.tr = trPart;
            exists.en = enPart;
          } else {
            words.push({
              en: enPart,
              tr: trPart,
              level: 0,
              lastSeen: -999,
              nextDue: 0
            });
            addedCount++;
          }
        }
      }
    });

    saveToStorage();
    document.getElementById("bulkInput").value = "";
    alert(`${addedCount} kelime havuza eklendi! Toplam: ${words.length}`);
    pickRandomWord();
  }

  // Tek tıkla İngilizce ve Türkçe yer değiştirme
  function swapWord(index) {
    let temp = words[index].en;
    words[index].en = words[index].tr;
    words[index].tr = temp;
    saveToStorage();
    pickRandomWord();
  }

  function deleteWord(index) {
    words.splice(index, 1);
    saveToStorage();
    pickRandomWord();
  }

  function renderWordList() {
    const container = document.getElementById("wordListContainer");
    if (!container) return;
    if (!words || words.length === 0) {
      container.innerHTML = "<div style='color: #64748b; font-size: 0.8rem; text-align: center;'>Havuz boş (Kelime ekleyin)</div>";
      return;
    }
    container.innerHTML = words.map((w, i) => `
      <div class="word-item">
        <span><b>${w.en}</b> = ${w.tr} <small style="color:#38bdf8;">(S${w.level})</small></span>
        <div class="word-actions">
          <button class="swap-btn" title="İngilizce ve Türkçe yerini değiştir" onclick="swapWord(${i})">⇄</button>
          <button class="del-btn" onclick="deleteWord(${i})">Sil</button>
        </div>
      </div>
    `).join("");
  }

  function clearAllWords() {
    if (confirm("Tüm kelime havuzunu sıfırlamak istediğinden emin misin?")) {
      words = [];
      totalSteps = 0;
      saveToStorage();
      pickRandomWord();
    }
  }

  function updateStats() {
    document.getElementById("stats").textContent = "Havuz: " + (words ? words.length : 0) + " kelime";
  }

  updateStats();
  renderWordList();
  pickRandomWord();
</script>

</body>
</html>
